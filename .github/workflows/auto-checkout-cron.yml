name: Auto Checkout Cron
on:
  schedule:
    # Her gün Türkiye saatiyle (UTC+3) 23:59'da çalışması için UTC 20:59'da ayarlanır
    - cron: '59 20 * * *'
  workflow_dispatch: # Manuel tetikleme için (Test amaçlı)

jobs:
  auto-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Checkout active sessions
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/auto-checkout" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Type: application/json"
